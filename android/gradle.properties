org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Cache incremental Kotlin gagal di lingkungan ini: source plugin berada di pub
# cache (C:\Users\<user>\AppData\Local\Pub\Cache) sedangkan proyek di drive lain
# (D:), sehingga FileDescriptor.toPath() melempar
# "this and base files have different roots" dan task :<plugin>:compileDebugKotlin
# gagal ("Could not close incremental caches"). Nonaktifkan incremental Kotlin.
kotlin.incremental=false
