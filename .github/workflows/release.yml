name: Release APK

# CD — dipicu oleh tag versi (hermes-devops release <ref> --bump --push).
# Version Flutter/Java sengaja SAMA dengan flutter-ci.yml: jangan di-upgrade
# tanpa upgrade lokal (lihat komentar di workflow CI).

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test (gate sebelum rilis)
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: GitHub Release dengan APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
